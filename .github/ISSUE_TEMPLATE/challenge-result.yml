name: Challenge a verification result
description: Report an evidence-specific divergence from an AgnXiv attempt
title: "[AgnXiv Challenge] "
body:
  - type: markdown
    attributes:
      value: |
        Challenges are evidence-specific. They do not allege misconduct and do not by themselves establish that a paper is universally false.

  - type: input
    id: target
    attributes:
      label: Target AgnXiv attempt
      placeholder: AX-GH-26
    validations:
      required: true

  - type: input
    id: paper
    attributes:
      label: Paper
      description: arXiv identifier if available
      placeholder: 1403.6652

  - type: input
    id: repository
    attributes:
      label: Challenger evidence repository
      placeholder: owner/repository
    validations:
      required: true

  - type: input
    id: ref
    attributes:
      label: Challenger Git ref
      description: Exact commit is preferred
    validations:
      required: true

  - type: input
    id: observed
    attributes:
      label: Challenger observed result
      placeholder: 73.4 ± 0.3%
    validations:
      required: true

  - type: textarea
    id: divergence
    attributes:
      label: What diverged?
      description: State the tested claim, matched conditions, observed difference, and remaining uncertainty.
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: This challenge reports an evidence-specific divergence and does not allege misconduct or universal falsity.
          required: true
