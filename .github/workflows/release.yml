name: release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  attestations: write
  id-token: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate release contract
        run: python scripts/check_release_contract.py
      - name: Require verified PR-merged mainline commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')"
          test "$verified" = "true"
          count="$(gh api             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls"             --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
          test "$count" -ge 1
      - id: plan
        name: Plan versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          tag="v$version"
          notes="docs/releases/$tag.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag exists without a GitHub Release; refusing partial release recovery."
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frozen release tooling
        run: |
          python -m pip install             "build==1.3.0"             "hatchling==1.27.0"             "twine==6.1.0"             "pip-audit==2.10.1"
          python -m pip install -e ".[dev,pdf]"

      - name: Re-run release-critical quality gates
        run: |
          python scripts/check_release_contract.py
          ruff check src tests examples/fixture-paper benchmarks/adapters research/scripts
          pytest
          python research/scripts/run_locator_benchmark.py --output /tmp/locator.json
          python research/scripts/run_aggregation_benchmark.py --output /tmp/aggregation.json
          python - <<'PY'
          import json
          from agnxiv.benchmark import load_jsonl_cases, run_recorded_benchmark

          red = run_recorded_benchmark(
              load_jsonl_cases("research/benchmarks/redbench-v0.jsonl")
          ).model_dump(mode="json")
          assert red["false_passes"] == 0
          assert red["false_contradictions"] == 0
          assert red["matched"] == red["total"]

          with open("/tmp/locator.json", encoding="utf-8") as handle:
              locator = json.load(handle)
          with open("/tmp/aggregation.json", encoding="utf-8") as handle:
              aggregation = json.load(handle)
          assert locator["false_selections"] == 0
          assert locator["missed_selections"] == 0
          assert locator["correct"] == locator["cases"]
          assert aggregation["matched"] == aggregation["cases"]
          PY

      - name: Build Python artifacts twice reproducibly
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          mkdir -p /tmp/build-a /tmp/build-b dist
          python -m build --no-isolation --outdir /tmp/build-a
          python -m build --no-isolation --outdir /tmp/build-b
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import shutil

          left = {path.name: path for path in Path("/tmp/build-a").iterdir()}
          right = {path.name: path for path in Path("/tmp/build-b").iterdir()}
          assert left.keys() == right.keys(), (left.keys(), right.keys())
          for name in sorted(left):
              a = left[name].read_bytes()
              b = right[name].read_bytes()
              assert sha256(a).digest() == sha256(b).digest(), name
              shutil.copy2(left[name], Path("dist") / name)
          PY
          python -m twine check dist/*

      - name: Verify package metadata and release version
        run: |
          python - <<'PY'
          import email
          import tarfile
          import zipfile
          from pathlib import Path

          version = __import__("os").environ["VERSION"]
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1
          assert len(sdists) == 1
          assert wheels[0].name.startswith(f"agnxiv-{version}-")
          assert sdists[0].name == f"agnxiv-{version}.tar.gz"

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_name))
          assert metadata["Name"] == "agnxiv"
          assert metadata["Version"] == version

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
          assert any(name.endswith("/pyproject.toml") for name in names)
          PY

      - name: Generate release SBOM
        run: |
          mkdir -p release
          pip-audit             -r constraints-service.txt             --no-deps             --format=cyclonedx-json             --output=release/agnxiv-service-sbom.json

      - name: Build release service image
        run: docker build -f Dockerfile.service -t "agnxiv-service:$TAG" .

      - name: Scan release service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agnxiv-service:${{ env.TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Create release manifest and checksums
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dockerfile = Path("Dockerfile.service").read_text(encoding="utf-8")
          base = dockerfile.splitlines()[0].removeprefix("FROM ").strip()
          constraints = Path("constraints-service.txt").read_bytes()
          manifest = {
              "schema_version": "agnxiv.release/1",
              "version": os.environ["VERSION"],
              "tag": os.environ["TAG"],
              "git_commit": os.environ["GITHUB_SHA"],
              "source_date_epoch": int(
                  __import__("subprocess").check_output(
                      ["git", "show", "-s", "--format=%ct", os.environ["GITHUB_SHA"]],
                      text=True,
                  ).strip()
              ),
              "python_artifacts": sorted(path.name for path in Path("dist").iterdir()),
              "service_base_image": base,
              "service_constraints_sha256": hashlib.sha256(constraints).hexdigest(),
              "release_gates": {
                  "full_tests": "passed",
                  "redbench": "passed",
                  "locator_benchmark": "passed",
                  "aggregation_benchmark": "passed",
                  "trivy_high_critical": "passed",
                  "reproducible_python_build": "passed",
              },
          }
          Path("release/release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum dist/* release/agnxiv-service-sbom.json release/release-manifest.json             > release/SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*
            release/agnxiv-service-sbom.json
            release/release-manifest.json
            release/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnxiv-${{ env.TAG }}-release-candidate
          path: |
            dist/*
            release/*
          retention-days: 90
          if-no-files-found: error

      - name: Create annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object="$(gh api             --method POST             "repos/$GITHUB_REPOSITORY/git/tags"             -f tag="$TAG"             -f message="AgnXiv $TAG"             -f object="$GITHUB_SHA"             -f type="commit"             --jq '.sha')"
          gh api             --method POST             "repos/$GITHUB_REPOSITORY/git/refs"             -f ref="refs/tags/$TAG"             -f sha="$tag_object"             >/dev/null

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG"             dist/*             release/agnxiv-service-sbom.json             release/release-manifest.json             release/SHA256SUMS             --verify-tag             --title "AgnXiv $TAG"             --notes-file "$NOTES"
