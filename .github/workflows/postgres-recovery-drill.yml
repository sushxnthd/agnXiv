name: postgres-recovery-drill

on:
  push:
    paths:
      - "src/agnxiv/service/db.py"
      - "migrations/**"
      - "alembic.ini"
      - ".github/workflows/postgres-recovery-drill.yml"
  pull_request:
    paths:
      - "src/agnxiv/service/db.py"
      - "migrations/**"
      - "alembic.ini"
      - ".github/workflows/postgres-recovery-drill.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIMARY_DATABASE_URL: postgresql+psycopg://agnxiv:agnxiv-drill@127.0.0.1:55432/agnxiv
      RESTORED_DATABASE_URL: postgresql+psycopg://agnxiv:agnxiv-drill@127.0.0.1:55432/agnxiv_restore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install hosted-service database dependencies
        run: python -m pip install -e ".[service]"

      - name: Start pinned PostgreSQL drill instance
        run: |
          docker run -d --rm \
            --name agnxiv-postgres-drill \
            -e POSTGRES_USER=agnxiv \
            -e POSTGRES_PASSWORD=agnxiv-drill \
            -e POSTGRES_DB=agnxiv \
            -p 55432:5432 \
            postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3

          for attempt in $(seq 1 30); do
            if docker exec agnxiv-postgres-drill pg_isready -U agnxiv -d agnxiv; then
              exit 0
            fi
            sleep 1
          done
          docker logs agnxiv-postgres-drill
          exit 1

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ env.PRIMARY_DATABASE_URL }}
        run: alembic upgrade head

      - name: Seed recovery probe and transparency commitment
        run: |
          python - <<'PY'
          import os

          from agnxiv.service.db import JobStore

          store = JobStore(os.environ["PRIMARY_DATABASE_URL"])
          job = store.create_job(
              job_id="00000000-0000-0000-0000-000000000901",
              api_key_hash="recovery-drill-api-key-hash",
              mode="auto_verify",
              repository="agnxiv/recovery-probe",
              repository_ref="9" * 40,
              arxiv_id="2601.00901",
              spec_path=None,
          )
          store.complete(
              job.id,
              status="succeeded",
              result={
                  "kind": "verification",
                  "zero_manifest": True,
                  "bundle": {
                      "recovery_probe": True,
                      "record": {"verdict": "VERIFIED"},
                  },
              },
              error=None,
          )
          assert store.verify_transparency_chain() is True
          assert store.transparency_head()[0] == 1
          PY

      - name: Create PostgreSQL custom-format backup
        run: |
          docker exec agnxiv-postgres-drill \
            pg_dump \
            -U agnxiv \
            -d agnxiv \
            --format=custom \
            --file=/tmp/agnxiv-recovery.dump
          docker cp \
            agnxiv-postgres-drill:/tmp/agnxiv-recovery.dump \
            /tmp/agnxiv-recovery.dump
          sha256sum /tmp/agnxiv-recovery.dump | tee /tmp/agnxiv-recovery.dump.sha256
          test -s /tmp/agnxiv-recovery.dump

      - name: Restore into clean database
        run: |
          docker exec agnxiv-postgres-drill \
            createdb -U agnxiv agnxiv_restore
          docker cp \
            /tmp/agnxiv-recovery.dump \
            agnxiv-postgres-drill:/tmp/agnxiv-recovery.dump
          docker exec agnxiv-postgres-drill \
            pg_restore \
            -U agnxiv \
            -d agnxiv_restore \
            --exit-on-error \
            /tmp/agnxiv-recovery.dump

      - name: Verify restored jobs, transparency chain, and mutation guards
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import text
          from sqlalchemy.exc import SQLAlchemyError

          from agnxiv.service.db import JobStore

          store = JobStore(os.environ["RESTORED_DATABASE_URL"])
          job = store.get_job("00000000-0000-0000-0000-000000000901")
          assert job is not None
          assert job.status == "succeeded"
          assert job.repository == "agnxiv/recovery-probe"
          assert store.transparency_head()[0] == 1
          assert store.verify_transparency_chain() is True

          try:
              with store.engine.begin() as connection:
                  connection.execute(
                      text(
                          "UPDATE agnxiv_transparency_entries "
                          "SET status = 'forged' WHERE sequence = 1"
                      )
                  )
          except SQLAlchemyError as exc:
              assert "append-only" in str(exc)
          else:
              raise AssertionError(
                  "restored transparency ledger lost its mutation guard"
              )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgres-recovery-drill-evidence
          path: |
            /tmp/agnxiv-recovery.dump
            /tmp/agnxiv-recovery.dump.sha256
          retention-days: 30
          if-no-files-found: warn

      - name: Stop recovery drill database
        if: always()
        run: docker stop agnxiv-postgres-drill || true
