name: zero-manifest-real-paper

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/zero-manifest-real-paper.yml"
      - "pyproject.toml"
      - "constraints-service.txt"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/zero-manifest-real-paper.yml"
      - "pyproject.toml"
      - "constraints-service.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metacognitive-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact trusted worker runtime
        run: python -m pip install --disable-pip-version-check -c constraints-service.txt "pydantic==2.14.1" "pypdf==6.21.1"

      - name: Download and automatically verify an external arXiv paper
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m agnxiv.hosted_runner \
            --mode auto_verify \
            --repository synthiumjp/metacognitive-monitoring-battery \
            --repository-ref 2f83d0fa506e7af2b72ca191b65ce42e07c9e185 \
            --arxiv-id 2604.15702 \
            --output /tmp/zero-manifest-real.json

      - name: Inspect reproducibility result
        run: |
          python - <<'PY'
          import json
          with open("/tmp/zero-manifest-real.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          result = payload.get("result") or {}
          bundle = result.get("bundle") or {}
          record = bundle.get("record") or {}
          locator = result.get("discovery") or {}
          plan = result.get("plan") or {}
          print(json.dumps({
              "status": payload.get("status"),
              "error": payload.get("error"),
              "reason": result.get("reason"),
              "kind": result.get("kind"),
              "claim": (bundle.get("claim") or {}).get("text"),
              "metric": (bundle.get("claim") or {}).get("metric"),
              "expected": record.get("expected"),
              "observed": record.get("observed_mean"),
              "verdict": record.get("verdict"),
              "frozen_locator": locator,
              "additional_verifications": [
                  {
                      "metric": (x.get("bundle") or {}).get("claim", {}).get("metric"),
                      "expected": (x.get("bundle") or {}).get("record", {}).get("expected"),
                      "observed": (x.get("bundle") or {}).get("record", {}).get("observed_mean"),
                      "verdict": (x.get("bundle") or {}).get("record", {}).get("verdict"),
                  }
                  for x in result.get("additional_verifications", [])
              ],
              "blockers": plan.get("blockers"),
              "commands": plan.get("commands"),
          }, indent=2)[:12000])
          PY

      - name: Require genuine execution-grounded claim-level verdicts
        run: |
          python - <<'PY'
          import json
          with open("/tmp/zero-manifest-real.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["status"] == "succeeded", payload.get("error") or (payload.get("result") or {}).get("reason")
          result = payload["result"]
          assert result["kind"] == "verification"
          assert result["zero_manifest"] is True
          locator = result["discovery"]
          assert locator["regex"]
          assert locator["discovery_stdout_sha256"]
          bundle = result["bundle"]
          assert bundle["record"]["verdict"] in {"VERIFIED", "CONTRADICTED"}
          assert bundle["observation_method"] == "explicit_regex"
          assert bundle["execution"]["returncode"] == 0
          assert bundle["execution"]["source_unchanged"] is True
          assert bundle["execution"]["image_id"].startswith("sha256:")
          assert bundle["manuscript"]["sha256"]
          assert bundle["provenance"]["git"]["commit"] == "2f83d0fa506e7af2b72ca191b65ce42e07c9e185"
          for item in result.get("additional_verifications", []):
              other = item["bundle"]
              assert other["record"]["verdict"] in {"VERIFIED", "CONTRADICTED"}
              assert other["execution"]["returncode"] == 0
              assert other["execution"]["source_unchanged"] is True
              assert other["observation_method"] == "explicit_regex"
          print("PASS: external paper, no manifest, frozen answer-blind locators, independent reruns, scoped claim verdicts")
          PY

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-manifest-metacognitive-evidence
          path: /tmp/zero-manifest-real.json
          retention-days: 30
          if-no-files-found: warn


  deepwalk-safe-abstention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact trusted worker runtime
        run: python -m pip install --disable-pip-version-check -c constraints-service.txt "pydantic==2.14.1" "pypdf==6.21.1"

      - name: Attempt zero-manifest DeepWalk scientific verification
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m agnxiv.hosted_runner \
            --mode auto_verify \
            --repository phanein/deepwalk \
            --repository-ref 6e6dff245e4692e9bea47e9017c1034e51afbf29 \
            --arxiv-id 1403.6652 \
            --output /tmp/zero-manifest-deepwalk.json

      - name: Require evidence-bound abstention on unresolved workflow
        run: |
          python - <<'PY'
          import json
          with open("/tmp/zero-manifest-deepwalk.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["status"] == "needs_review", payload.get("error")
          result = payload["result"]
          assert result["kind"] == "auto_plan", result
          assert result["repository_commit"] == "6e6dff245e4692e9bea47e9017c1034e51afbf29"
          assert result["plan"]["safe_to_execute"] is False
          assert result["plan"]["blockers"]
          assert "bundle" not in result
          print("PASS: a second pinned arXiv paper safely abstains instead of claiming unsupported reproduction.")
          PY

      - name: Upload DeepWalk abstention evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-manifest-deepwalk-evidence
          path: /tmp/zero-manifest-deepwalk.json
          retention-days: 30
          if-no-files-found: warn
