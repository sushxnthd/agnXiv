name: cross-region-recovery-drill

on:
  push:
    paths:
      - "src/agnxiv/service/db.py"
      - "migrations/**"
      - "alembic.ini"
      - "docs/DISASTER_RECOVERY.md"
      - ".github/workflows/cross-region-recovery-drill.yml"
  pull_request:
    paths:
      - "src/agnxiv/service/db.py"
      - "migrations/**"
      - "alembic.ini"
      - "docs/DISASTER_RECOVERY.md"
      - ".github/workflows/cross-region-recovery-drill.yml"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  region-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRIMARY_DATABASE_URL: postgresql+psycopg://agnxiv:drill@127.0.0.1:55432/agnxiv
      SECONDARY_DATABASE_URL: postgresql+psycopg://agnxiv:drill@127.0.0.1:55433/agnxiv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install service dependencies
        run: python -m pip install -e ".[service]"

      - name: Start independent primary and secondary PostgreSQL regions
        run: |
          docker run -d --rm             --name agnxiv-region-a             -e POSTGRES_USER=agnxiv             -e POSTGRES_PASSWORD=drill             -e POSTGRES_DB=agnxiv             -p 55432:5432             postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          docker run -d --rm             --name agnxiv-region-b             -e POSTGRES_USER=agnxiv             -e POSTGRES_PASSWORD=drill             -e POSTGRES_DB=agnxiv             -p 55433:5432             postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3

          for port in 55432 55433; do
            for attempt in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -p "$port" -U agnxiv -d agnxiv; then
                break
              fi
              sleep 1
            done
            pg_isready -h 127.0.0.1 -p "$port" -U agnxiv -d agnxiv
          done

      - name: Migrate and seed primary region
        env:
          DATABASE_URL: ${{ env.PRIMARY_DATABASE_URL }}
        run: |
          alembic upgrade head
          python - <<'PY'
          import os
          from agnxiv.service.db import JobStore

          store = JobStore(os.environ["PRIMARY_DATABASE_URL"])
          for index in range(1, 4):
              job_id = f"00000000-0000-0000-0000-0000000009{index:02d}"
              job = store.create_job(
                  job_id=job_id,
                  api_key_hash="cross-region-drill",
                  mode="auto_verify",
                  repository="agnxiv/cross-region-probe",
                  repository_ref=str(index) * 40,
                  arxiv_id=f"2601.009{index:02d}",
                  spec_path=None,
              )
              store.complete(
                  job.id,
                  status="succeeded",
                  result={
                      "kind": "verification",
                      "zero_manifest": True,
                      "bundle": {"dr_probe": index},
                  },
                  error=None,
              )
          assert store.transparency_head()[0] == 3
          assert store.verify_transparency_chain() is True
          PY

      - name: Export primary recovery point
        run: |
          docker exec agnxiv-region-a             pg_dump -U agnxiv -d agnxiv --format=custom             --file=/tmp/agnxiv-region-a.dump
          docker cp agnxiv-region-a:/tmp/agnxiv-region-a.dump /tmp/agnxiv-region-a.dump
          sha256sum /tmp/agnxiv-region-a.dump | tee /tmp/agnxiv-region-a.dump.sha256
          test -s /tmp/agnxiv-region-a.dump

      - name: Restore recovery point into independent secondary region
        run: |
          docker cp /tmp/agnxiv-region-a.dump agnxiv-region-b:/tmp/agnxiv-region-a.dump
          docker exec agnxiv-region-b             pg_restore -U agnxiv -d agnxiv --clean --if-exists --exit-on-error             /tmp/agnxiv-region-a.dump

      - name: Simulate primary region loss
        run: docker stop agnxiv-region-a

      - name: Validate secondary region after primary loss
        run: |
          python - <<'PY'
          import os
          from agnxiv.service.db import JobStore

          store = JobStore(os.environ["SECONDARY_DATABASE_URL"])
          assert store.ping() is True
          assert store.transparency_head()[0] == 3
          assert store.verify_transparency_chain() is True
          for index in range(1, 4):
              job_id = f"00000000-0000-0000-0000-0000000009{index:02d}"
              job = store.get_job(job_id)
              assert job is not None
              assert job.status == "succeeded"
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cross-region-recovery-evidence
          path: |
            /tmp/agnxiv-region-a.dump
            /tmp/agnxiv-region-a.dump.sha256
          retention-days: 30
          if-no-files-found: warn

      - name: Stop drill databases
        if: always()
        run: |
          docker stop agnxiv-region-a 2>/dev/null || true
          docker stop agnxiv-region-b 2>/dev/null || true
