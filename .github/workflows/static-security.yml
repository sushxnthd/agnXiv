name: static-security

on:
  push:
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned Bandit
        run: python -m pip install "bandit==1.9.4"
      - name: Block medium/high-confidence medium/high-severity Python findings
        run: |
          bandit -r src/agnxiv \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output /tmp/bandit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bandit-security-report
          path: /tmp/bandit.json
          retention-days: 90
          if-no-files-found: warn

  actions-zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned zizmor
        run: python -m pip install "zizmor==1.31.1"
      - name: Block medium/high GitHub Actions security findings
        run: |
          zizmor \
            --collect=workflows \
            --strict-collection \
            --min-severity=medium \
            --format=plain \
            . | tee /tmp/zizmor.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zizmor-security-report
          path: /tmp/zizmor.txt
          retention-days: 90
          if-no-files-found: warn
