name: external-benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perturbation-measurements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AgnXiv
        uses: actions/checkout@v4

      - name: Checkout third-party research artifact
        uses: actions/checkout@v4
        with:
          repository: Pranavsingh431/Perturbation-Based-Measurements
          ref: d7fa58215bf6966df70d05f5433f1238c05d2ea0
          path: external/perturbation-measurements

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pdf]"

      - name: Prepare pinned base runtime
        run: docker pull python:3.11-slim

      - name: Build third-party environment from manifest only
        run: |
          agnxiv build-env external/perturbation-measurements             --base-image python:3.11-slim             > /tmp/external-build.json
          cat /tmp/external-build.json
          python - <<'PY'
          import json

          with open("/tmp/external-build.json", encoding="utf-8") as handle:
              build = json.load(handle)

          assert build["image_id"].startswith("sha256:")
          assert build["base_image_id"].startswith("sha256:")
          assert build["plan"]["safe_manifest_only"] is True
          assert build["plan"]["dependency_precision"] == "floating"

          with open("/tmp/external-image-ref.txt", "w", encoding="utf-8") as handle:
              handle.write(build["image_ref"])
          PY

      - name: Audit the authors' complete reproduction checker
        shell: bash
        run: |
          IMAGE_REF="$(cat /tmp/external-image-ref.txt)"
          agnxiv verify-command external/perturbation-measurements             --image "$IMAGE_REF"             --cmd python             --cmd evaluation/reproduce.py             --expected 96             --metric reported-checks             --claim-text "All 96 released paper-number checks reproduce."             --kind absolute             --tolerance 0             --output-regex '(?P<value>[0-9]+)/96 checks passed'             > /tmp/author-reproduction-audit.json

      - name: Show complete reproduction audit
        run: cat /tmp/author-reproduction-audit.json

      - name: Assert the complete checker is not certifiable
        run: |
          python - <<'PY'
          import json

          with open(
              "/tmp/author-reproduction-audit.json",
              encoding="utf-8",
          ) as handle:
              audit = json.load(handle)["bundle"]

          assert audit["record"]["verdict"] == "UNABLE_TO_VERIFY"
          assert audit["execution"]["returncode"] == 1
          assert "94/96 checks passed" in audit["execution"]["stdout_excerpt"]
          assert "[FAIL] AUC confidence alone" in audit["execution"]["stdout_excerpt"]
          assert "[FAIL] incremental AUC gain" in audit["execution"]["stdout_excerpt"]
          PY

      - name: Generate ephemeral benchmark issuer
        run: |
          agnxiv keygen             --private-out /tmp/external-private.pem             --public-out /tmp/external-public.pem             > /tmp/external-key.json

      - name: Independently recompute a central reported effect
        shell: bash
        run: |
          IMAGE_REF="$(cat /tmp/external-image-ref.txt)"
          agnxiv verify-command external/perturbation-measurements             --image "$IMAGE_REF"             --cmd python             --cmd /agnxiv-artifacts/000-perturbation_pool_a.py             --expected 26.6             --metric gap-G             --claim-text "Pool A gap G (15-85) is 26.6."             --kind absolute             --tolerance 0.2             --artifact benchmarks/adapters/perturbation_pool_a.py             --artifact external/perturbation-measurements/results/paper_numbers.json             --json-path metrics.poolA_gap_15_85             --sign-key /tmp/external-private.pem             > /tmp/external-verification.json

      - name: Show independent verification record
        run: cat /tmp/external-verification.json

      - name: Assert independent third-party verification
        run: |
          python - <<'PY'
          import json

          pinned_commit = "d7fa58215bf6966df70d05f5433f1238c05d2ea0"

          with open("/tmp/external-verification.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          bundle = payload["bundle"]
          statement = payload["statement"]
          envelope = payload["dsseEnvelope"]

          assert bundle["record"]["verdict"] == "VERIFIED"
          assert bundle["observation_method"] == "explicit_json_path"
          assert bundle["observation_locator"] == "metrics.poolA_gap_15_85"
          assert abs(bundle["record"]["observed_mean"] - 26.6) <= 0.2 + 1e-12
          assert bundle["execution"]["returncode"] == 0
          assert bundle["execution"]["source_unchanged"] is True
          assert bundle["execution"]["artifacts_unchanged"] is True
          assert len(bundle["artifacts"]) == 2
          assert bundle["provenance"]["git"]["commit"] == pinned_commit
          assert bundle["provenance"]["git"]["dirty"] is False

          assert statement["_type"] == "https://in-toto.io/Statement/v1"
          assert statement["predicate"]["result"]["verdict"] == "VERIFIED"
          assert statement["predicate"]["source"]["gitCommit"] == pinned_commit
          assert envelope["payloadType"] == "application/vnd.in-toto+json"

          with open("/tmp/external-envelope.json", "w", encoding="utf-8") as handle:
              json.dump(envelope, handle)
          PY

      - name: Verify third-party DSSE envelope offline
        run: |
          agnxiv verify-envelope /tmp/external-envelope.json             --public-key /tmp/external-public.pem             > /tmp/external-authenticated-statement.json

      - name: Assert authenticated external statement
        run: |
          python - <<'PY'
          import json

          with open(
              "/tmp/external-authenticated-statement.json",
              encoding="utf-8",
          ) as handle:
              statement = json.load(handle)

          assert statement["predicate"]["result"]["verdict"] == "VERIFIED"
          assert statement["predicate"]["observation"]["method"] == "explicit_json_path"
          assert len(statement["subject"]) == 3
          PY
