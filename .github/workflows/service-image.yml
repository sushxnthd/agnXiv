name: service-image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build hosted service image
        run: docker build -f Dockerfile.service -t agnxiv-service:test .

      - name: Start service container
        run: |
          docker run -d --rm             --name agnxiv-service-test             -p 18000:8000             -e PORT=8000             -e DATABASE_URL=sqlite:////tmp/agnxiv-service.db             agnxiv-service:test

      - name: Wait for health endpoint
        run: |
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:18000/healthz",
                      timeout=2,
                  ) as response:
                      assert response.status == 200
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("service did not become healthy")
          PY

      - name: Assert readiness is closed in unconfigured container
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          try:
              urllib.request.urlopen(
                  "http://127.0.0.1:18000/readyz",
                  timeout=2,
              )
          except urllib.error.HTTPError as exc:
              assert exc.code == 503
          else:
              raise SystemExit("unconfigured service unexpectedly reported ready")
          PY

      - name: Show container logs
        if: always()
        run: docker logs agnxiv-service-test || true

      - name: Stop service container
        if: always()
        run: docker stop agnxiv-service-test || true
