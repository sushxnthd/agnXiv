name: centrality-production

on:
  push:
    paths:
      - "research/scripts/run_centrality_aggregate.py"
      - ".github/workflows/centrality-production.yml"
  pull_request:
    paths:
      - "research/scripts/run_centrality_aggregate.py"
      - ".github/workflows/centrality-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout-multisource:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AgnXiv
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned ReproRepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: LithiumDA/ReproRepo
          ref: 470a4c69d9f11df15526464e0a5bb66d95a12f55
          path: external/reprorepo
          persist-credentials: false

      - name: Checkout pinned ICLR OpenReview metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: astenuz/iclr2024-openreview
          ref: 740c3112f479019d9902780fd627b0b7c19eac7c
          path: external/iclr2024-openreview
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install verifier
        run: python -m pip install -e .

      - name: Run disjoint ReproRepo holdout
        run: |
          python research/scripts/run_external_centrality_validation.py \
            --input external/reprorepo/paper_lists/neurips_main-2022.csv \
            --input external/reprorepo/paper_lists/neurips_db-2022.csv \
            --input external/reprorepo/paper_lists/neurips_main-2024.csv \
            --input external/reprorepo/paper_lists/neurips_db-2024.csv \
            --input external/reprorepo/paper_lists/iclr-2026.csv \
            --exclude research/benchmarks/centrality-dev-paper-clusters-v1.txt \
            --max-cases 120 \
            --minimum-cases 20 \
            --min-recall-at-3 0.90 \
            --min-recall-at-5 0.95 \
            --output /tmp/reprorepo-centrality.json

      - name: Run disjoint OpenReview extension
        run: |
          python research/scripts/run_openreview_centrality_validation.py \
            --input external/iclr2024-openreview/data/iclr2024_papers.csv \
            --hash-seed agnxiv-openreview-centrality-v1 \
            --hash-modulus 5 \
            --hash-bucket 1 \
            --hash-bucket 2 \
            --hash-bucket 3 \
            --hash-bucket 4 \
            --minimum-cases 50 \
            --minimum-areas 4 \
            --min-recall-at-3 0.90 \
            --min-recall-at-5 0.95 \
            --output /tmp/openreview-centrality.json

      - name: Enforce aggregate production threshold
        run: |
          python research/scripts/run_centrality_aggregate.py \
            --report /tmp/reprorepo-centrality.json \
            --report /tmp/openreview-centrality.json \
            --minimum-sources 2 \
            --minimum-cases 75 \
            --min-recall-at-3 0.90 \
            --min-recall-at-5 0.95 \
            --output /tmp/centrality-production.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: centrality-production-evidence
          path: |
            /tmp/reprorepo-centrality.json
            /tmp/openreview-centrality.json
            /tmp/centrality-production.json
          retention-days: 90
          if-no-files-found: warn
