name: challenge-record

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  record:
    if: startsWith(github.event.issue.title, '[AgnXiv Challenge]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted AgnXiv
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AgnXiv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Normalize challenge record
        run: |
          python -m agnxiv.github_challenge \
            --event "$GITHUB_EVENT_PATH" \
            --output-dir /tmp/agnxiv-challenge

      - name: Upload immutable challenge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnxiv-challenge-${{ github.event.issue.number }}
          path: /tmp/agnxiv-challenge
          retention-days: 90
          if-no-files-found: error

  publish:
    if: always() && startsWith(github.event.issue.title, '[AgnXiv Challenge]')
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Download challenge record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agnxiv-challenge-${{ github.event.issue.number }}
          path: /tmp/agnxiv-challenge

      - name: Publish normalized challenge
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/agnxiv-challenge/summary.md', 'utf8');
            const challenge = JSON.parse(
              fs.readFileSync('/tmp/agnxiv-challenge/challenge.json', 'utf8')
            );
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/runs/' + context.runId;
            const targetNumber = String(challenge.attempt_id).replace('AX-GH-', '');
            const targetUrl = 'https://sushxnthd.github.io/agnXiv/result.html?issue=' +
              targetNumber;
            const body = summary + '\n[Open target attempt](' + targetUrl +
              ') · [View challenge provenance](' + runUrl + ')';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
