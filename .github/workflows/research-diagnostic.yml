name: research-diagnostic

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - "src/agnxiv/research.py"
      - "src/agnxiv/alignment.py"
      - "src/agnxiv/auto.py"
      - "src/agnxiv/claims.py"
      - "src/agnxiv/planner.py"
      - "src/agnxiv/environment.py"
      - "src/agnxiv/evidence.py"
      - ".github/workflows/research-diagnostic.yml"
  pull_request:
    paths:
      - "research/**"
      - "src/agnxiv/research.py"
      - "src/agnxiv/alignment.py"
      - "src/agnxiv/auto.py"
      - "src/agnxiv/claims.py"
      - "src/agnxiv/planner.py"
      - "src/agnxiv/environment.py"
      - "src/agnxiv/evidence.py"
      - ".github/workflows/research-diagnostic.yml"
  workflow_dispatch:
    inputs:
      case_id:
        description: Optional single registered case ID
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        case_id:
          - SCICOQA-3f098eb0
          - SCICOQA-25ee1fd2
          - SCICOQA-183bd763
          - SCICOQA-9a6bc557
          - SCICOQA-63197a77
          - SCICOQA-61926641
          - SCICOQA-7cd4b3d7
          - SCICOQA-7c8468c8
    if: github.event_name != 'workflow_dispatch' || inputs.case_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pdf]"

      - name: Run static diagnostic
        run: |
          python research/scripts/run_diagnostic_case.py \
            --case-id "${{ matrix.case_id }}" \
            --output-dir "/tmp/${{ matrix.case_id }}"

      - name: Assert diagnostic contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          payload = json.loads(
              (Path("/tmp") / case_id / "summary.json").read_text(encoding="utf-8")
          )
          assert payload["schema_version"] == "agnxiv.research-diagnostic/1"
          assert payload["evaluation_role"] == "diagnostic_nonblind"
          assert 0.0 <= payload["automation_score"] <= 1.0
          assert "observation_locator" in payload["stages"]
          PY
        env:
          CASE_ID: ${{ matrix.case_id }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-diagnostic-${{ matrix.case_id }}
          path: /tmp/${{ matrix.case_id }}
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: diagnostic
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download diagnostic artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: research-diagnostic-*
          path: /tmp/agnxiv-diagnostics

      - name: Aggregate research metrics
        run: |
          python research/scripts/aggregate_diagnostics.py \
            --input-root /tmp/agnxiv-diagnostics \
            --output /tmp/agnxiv-diagnostic-summary.json

      - name: Install centrality scoring dependencies
        run: python -m pip install -e .

      - name: Score frozen central-claim regression set
        run: |
          python research/scripts/run_centrality_diagnostic.py \
            --input-root /tmp/agnxiv-diagnostics \
            --gold research/benchmarks/centrality-gold-v0.jsonl \
            --output /tmp/agnxiv-centrality-diagnostic.json
          python - <<'PY'
          import json

          with open(
              "/tmp/agnxiv-centrality-diagnostic.json",
              encoding="utf-8",
          ) as handle:
              report = json.load(handle)

          assert report["evaluation_role"] == "diagnostic_nonblind"
          assert report["cases"] == 3
          assert report["recall_at_1"] == 1.0
          assert report["recall_at_3"] == 1.0
          assert report["recall_at_5"] == 1.0
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-diagnostic-summary
          path: |
            /tmp/agnxiv-diagnostic-summary.json
            /tmp/agnxiv-centrality-diagnostic.json
          retention-days: 90
          if-no-files-found: error

  single-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.case_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[pdf]"
      - run: |
          python research/scripts/run_diagnostic_case.py \
            --case-id "$CASE_ID" \
            --output-dir "/tmp/research-diagnostic"
        env:
          CASE_ID: ${{ inputs.case_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-diagnostic-${{ inputs.case_id }}
          path: /tmp/research-diagnostic
          retention-days: 90
          if-no-files-found: error
