name: release-provenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-production-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build production service image
        run: docker build --file Dockerfile.service --tag agnxiv-service:release .

      - name: Generate deterministic release manifest
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def digest(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          image_id = subprocess.check_output(
              [
                  "docker",
                  "image",
                  "inspect",
                  "agnxiv-service:release",
                  "--format",
                  "{{.Id}}",
              ],
              text=True,
          ).strip()
          dockerfile = Path("Dockerfile.service").read_text(encoding="utf-8")
          base_image = dockerfile.splitlines()[0].removeprefix("FROM ").strip()
          payload = {
              "schema_version": "agnxiv.release/1",
              "commit_sha": os.environ["RELEASE_SHA"],
              "service_image_id": image_id,
              "service_base_image": base_image,
              "dockerfile_sha256": digest("Dockerfile.service"),
              "constraints_sha256": digest("constraints-service.txt"),
              "hosted_workflow_sha256": digest(
                  ".github/workflows/hosted-verify.yml"
              ),
              "production_gate_sha256": digest(
                  ".github/workflows/production-gate.yml"
              ),
              "migration_files": {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(Path("migrations/versions").glob("*.py"))
              },
          }
          Path("agnxiv-release-manifest.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2))
          PY

      - name: Attest release manifest through GitHub/Sigstore
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: agnxiv-release-manifest.json

      - name: Verify attestation immediately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify agnxiv-release-manifest.json \
            --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnxiv-release-provenance-${{ github.sha }}
          path: |
            agnxiv-release-manifest.json
            ${{ steps.attest.outputs.bundle-path }}
          retention-days: 90
          if-no-files-found: error
