name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pdf]"
      - run: ruff check src tests examples/fixture-paper
      - run: pytest
      - name: Prepare integration runtime
        run: docker pull python:3.11-slim
      - name: Run end-to-end AgnXiv verification
        run: |
          agnxiv verify-command examples/fixture-paper             --image python:3.11-slim             --cmd python             --cmd reproduce.py             --expected 0.914             --metric accuracy             --unit fraction             --manuscript examples/fixture-paper/paper.txt             > /tmp/agnxiv-integration.json
      - name: Show integration verification record
        run: cat /tmp/agnxiv-integration.json
      - name: Assert verification evidence
        run: |
          python - <<'PY'
          import json

          with open("/tmp/agnxiv-integration.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          bundle = payload["bundle"]
          attestation = payload["attestation"]

          assert bundle["record"]["verdict"] == "VERIFIED"
          assert bundle["execution"]["source_unchanged"] is True
          assert bundle["execution"]["image_id"].startswith("sha256:")
          assert bundle["manuscript"]["sha256"]
          assert attestation["manuscript_sha256"] == bundle["manuscript"]["sha256"]
          assert attestation["repository_tree_sha256"] == bundle["provenance"]["tree_digest"]
          PY
