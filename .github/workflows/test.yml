name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pdf]"
      - run: ruff check src tests examples/fixture-paper benchmarks/adapters research/scripts
      - run: pytest

      - name: Prepare integration runtime
        run: docker pull python:3.11-slim

      - name: Generate ephemeral verification issuer
        run: |
          agnxiv keygen \
            --private-out /tmp/agnxiv-private.pem \
            --public-out /tmp/agnxiv-public.pem \
            > /tmp/agnxiv-key.json

      - name: Run end-to-end manifest verification
        run: |
          agnxiv verify-spec examples/agnxiv-fixture.json \
            --sign-key /tmp/agnxiv-private.pem \
            > /tmp/agnxiv-integration.json

      - name: Show integration verification record
        run: cat /tmp/agnxiv-integration.json

      - name: Assert verification evidence
        run: |
          python - <<'PY'
          import json

          with open("/tmp/agnxiv-integration.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          bundle = payload["bundle"]
          attestation = payload["attestation"]
          statement = payload["statement"]
          envelope = payload["dsseEnvelope"]

          assert bundle["record"]["verdict"] == "VERIFIED"
          assert bundle["verification_spec_sha256"]
          assert bundle["execution"]["source_unchanged"] is True
          assert bundle["execution"]["artifacts_unchanged"] is True
          assert bundle["execution"]["image_id"].startswith("sha256:")
          assert bundle["observation_method"] == "explicit_json_path"
          assert bundle["observation_locator"] == "metrics.accuracy"
          assert bundle["manuscript"]["sha256"]
          assert len(bundle["artifacts"]) == 1
          assert attestation["manuscript_sha256"] == bundle["manuscript"]["sha256"]
          assert attestation["artifact_sha256"] == [bundle["artifacts"][0]["sha256"]]
          assert attestation["repository_tree_sha256"] == bundle["provenance"]["tree_digest"]

          assert statement["_type"] == "https://in-toto.io/Statement/v1"
          assert statement["predicate"]["result"]["verdict"] == "VERIFIED"
          assert len(statement["subject"]) == 4
          spec_subject = next(
              subject
              for subject in statement["subject"]
              if subject["name"] == "verification-spec"
          )
          assert (
              spec_subject["digest"]["sha256"]
              == bundle["verification_spec_sha256"]
          )
          assert envelope["payloadType"] == "application/vnd.in-toto+json"

          with open("/tmp/agnxiv-envelope.json", "w", encoding="utf-8") as handle:
              json.dump(envelope, handle)
          PY

      - name: Verify DSSE envelope independently
        run: |
          agnxiv verify-envelope /tmp/agnxiv-envelope.json \
            --public-key /tmp/agnxiv-public.pem \
            > /tmp/agnxiv-verified-statement.json

      - name: Assert authenticated statement
        run: |
          python - <<'PY'
          import json

          with open("/tmp/agnxiv-verified-statement.json", encoding="utf-8") as handle:
              statement = json.load(handle)

          assert statement["_type"] == "https://in-toto.io/Statement/v1"
          assert statement["predicate"]["result"]["verdict"] == "VERIFIED"
          assert len(statement["subject"]) == 4
          assert any(
              subject["name"] == "verification-spec"
              for subject in statement["subject"]
          )
          PY
