name: security-audit

on:
  push:
    paths:
      - "src/**"
      - "constraints-service.txt"
      - "Dockerfile.service"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "constraints-service.txt"
      - "Dockerfile.service"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned security analyzers
        run: python -m pip install "bandit==1.9.4" "zizmor==1.31.1"
      - name: Block high-severity Python findings
        run: bandit -r src -q -lll
      - name: Audit GitHub Actions security
        run: zizmor .github/workflows

  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned audit tool
        run: python -m pip install "pip-audit==2.10.1"
      - name: Audit frozen hosted-service dependency set
        run: |
          pip-audit \
            -r constraints-service.txt \
            --no-deps \
            --format=json \
            --output=/tmp/pip-audit.json
      - name: Emit CycloneDX SBOM
        run: |
          pip-audit \
            -r constraints-service.txt \
            --no-deps \
            --format=cyclonedx-json \
            --output=/tmp/agnxiv-service-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hosted-service-security-audit
          path: |
            /tmp/pip-audit.json
            /tmp/agnxiv-service-sbom.json
          retention-days: 90
          if-no-files-found: warn
