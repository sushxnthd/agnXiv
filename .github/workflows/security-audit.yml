name: security-audit

on:
  push:
    paths:
      - "constraints-service.txt"
      - "Dockerfile.service"
      - "pyproject.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "constraints-service.txt"
      - "Dockerfile.service"
      - "pyproject.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned audit tool
        run: python -m pip install "pip-audit==2.10.1"
      - name: Audit frozen hosted-service dependency set
        run: |
          pip-audit \
            -r constraints-service.txt \
            --no-deps \
            --format=json \
            --output=/tmp/pip-audit.json
      - name: Emit CycloneDX SBOM
        run: |
          pip-audit \
            -r constraints-service.txt \
            --no-deps \
            --format=cyclonedx-json \
            --output=/tmp/agnxiv-service-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hosted-service-security-audit
          path: |
            /tmp/pip-audit.json
            /tmp/agnxiv-service-sbom.json
          retention-days: 90
          if-no-files-found: warn


  container-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build production service and trusted parser images
        run: |
          docker build --file Dockerfile.service --tag agnxiv-service:security-audit .
          docker build --file Dockerfile.pdf-parser --tag agnxiv-pdf-parser:security-audit .

      - name: Block fixed HIGH/CRITICAL OS and library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agnxiv-service:security-audit
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-container.json
          exit-code: "1"

      - name: Block fixed HIGH/CRITICAL parser-image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agnxiv-pdf-parser:security-audit
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-pdf-parser.json
          exit-code: "1"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hosted-service-container-security-audit
          path: |
            trivy-container.json
            trivy-pdf-parser.json
          retention-days: 90
          if-no-files-found: warn
