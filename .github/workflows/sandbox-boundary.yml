name: sandbox-boundary

on:
  push:
    paths:
      - "src/agnxiv/worker_boundary.py"
      - "src/agnxiv/sandbox.py"
      - "src/agnxiv/hosted_runner.py"
      - "tests/test_worker_boundary.py"
      - "tests/test_sandbox.py"
      - ".github/workflows/hosted-verify.yml"
      - ".github/workflows/sandbox-boundary.yml"
  pull_request:
    paths:
      - "src/agnxiv/worker_boundary.py"
      - "src/agnxiv/sandbox.py"
      - "src/agnxiv/hosted_runner.py"
      - "tests/test_worker_boundary.py"
      - "tests/test_sandbox.py"
      - ".github/workflows/hosted-verify.yml"
      - ".github/workflows/sandbox-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outer-vm-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install AgnXiv
        run: python -m pip install -e ".[dev]"
      - name: Assert ephemeral VM boundary has no callback credentials
        run: python -m agnxiv.worker_boundary --strict
      - name: Run sandbox boundary regression tests
        run: pytest tests/test_worker_boundary.py tests/test_sandbox.py tests/test_hosted_runner.py
