name: generate-service-lock

on:
  workflow_dispatch:
  push:
    paths:
      - "pyproject.toml"
      - "constraints-service.txt"
      - ".github/workflows/generate-service-lock.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "constraints-service.txt"
      - ".github/workflows/generate-service-lock.yml"

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned lock compiler
        run: python -m pip install "pip-tools==7.6.2"
      - name: Compile fully hashed production dependency lock
        run: |
          pip-compile pyproject.toml \
            --extra service \
            --extra sign \
            --extra pdf \
            --constraint constraints-service.txt \
            --generate-hashes \
            --resolver=backtracking \
            --output-file=/tmp/requirements-service.lock
          grep -q -- "--hash=sha256:" /tmp/requirements-service.lock
          cat /tmp/requirements-service.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: requirements-service-lock
          path: /tmp/requirements-service.lock
          retention-days: 30
          if-no-files-found: error
