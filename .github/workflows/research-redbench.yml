name: research-redbench

on:
  push:
    branches: [main]
    paths:
      - "research/benchmarks/redbench-v0.jsonl"
      - "src/agnxiv/outputs.py"
      - "src/agnxiv/benchmark.py"
      - ".github/workflows/research-redbench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run adversarial recorded-output benchmark
        run: |
          python - <<'PY' | tee /tmp/redbench-report.json
          import json
          from agnxiv.benchmark import load_jsonl_cases, run_recorded_benchmark

          report = run_recorded_benchmark(
              load_jsonl_cases("research/benchmarks/redbench-v0.jsonl")
          )
          print(json.dumps(report.model_dump(mode="json"), indent=2))
          PY
      - name: Assert research report contract
        run: |
          python - <<'PY'
          import json
          with open("/tmp/redbench-report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["total"] >= 12
          assert report["matched"] == report["total"]
          assert report["false_passes"] == 0
          assert report["false_contradictions"] == 0
          assert report["false_pass_rate"] == 0.0
          assert report["coverage"] >= 0.50
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redbench-v0-report
          path: /tmp/redbench-report.json
          retention-days: 90
