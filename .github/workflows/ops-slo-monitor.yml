name: ops-slo-monitor

on:
  push:
    paths:
      - "src/agnxiv/service/db.py"
      - "src/agnxiv/service/ops.py"
      - "src/agnxiv/service/app.py"
      - "tests/test_ops.py"
      - ".github/workflows/ops-slo-monitor.yml"
  pull_request:
    paths:
      - "src/agnxiv/service/db.py"
      - "src/agnxiv/service/ops.py"
      - "src/agnxiv/service/app.py"
      - "tests/test_ops.py"
      - ".github/workflows/ops-slo-monitor.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slo-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_ops.py tests/test_service_hardening.py

  production-watch:
    if: ${{ vars.AGNXIV_PRODUCTION_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check readiness and SLO status
        env:
          BASE_URL: ${{ vars.AGNXIV_PRODUCTION_URL }}
          API_KEY: ${{ secrets.AGNXIV_MONITOR_API_KEY }}
        run: |
          test -n "$API_KEY"
          curl --fail --silent --show-error --max-time 15 "$BASE_URL/readyz" >/tmp/ready.json
          curl --fail --silent --show-error --max-time 15             -H "X-API-Key: $API_KEY"             "$BASE_URL/v1/ops/status" >/tmp/ops.json
          python - <<'PY'
          import json
          with open("/tmp/ops.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["passed"] is True, report
          PY
