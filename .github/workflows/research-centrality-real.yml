name: research-centrality-real

on:
  push:
    paths:
      - "research/benchmarks/centrality-real-v1-*.jsonl"
      - "research/scripts/run_diagnostic_case.py"
      - "src/agnxiv/auto.py"
      - "src/agnxiv/claims.py"
      - ".github/workflows/research-centrality-real.yml"
  pull_request:
    paths:
      - "research/benchmarks/centrality-real-v1-*.jsonl"
      - "research/scripts/run_diagnostic_case.py"
      - "src/agnxiv/auto.py"
      - "src/agnxiv/claims.py"
      - ".github/workflows/research-centrality-real.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        case_id:
          - CENTRALITY-KOOPA
          - CENTRALITY-LORA
          - CENTRALITY-MASKGIT
          - CENTRALITY-GRAPHORMER
          - CENTRALITY-DEEPWALK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[pdf]"
      - name: Evaluate fixed real-paper central claim
        run: |
          python research/scripts/run_diagnostic_case.py \
            --manifest research/benchmarks/centrality-real-v1-cases.jsonl \
            --centrality-gold research/benchmarks/centrality-real-v1-gold.jsonl \
            --localization-gold /tmp/no-localization-gold.jsonl \
            --case-id "${{ matrix.case_id }}" \
            --output-dir "/tmp/${{ matrix.case_id }}"
      - name: Require a scored centrality result
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(
              (Path("/tmp") / os.environ["CASE_ID"] / "summary.json").read_text()
          )
          assert payload["centrality"] is not None
          assert payload["evaluation_role"] == "development"
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: centrality-real-${{ matrix.case_id }}
          path: /tmp/${{ matrix.case_id }}/summary.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: evaluate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: centrality-real-*
          path: /tmp/centrality
      - name: Aggregate and enforce predeclared development thresholds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for path in sorted(Path("/tmp/centrality").rglob("summary.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              rows.append(payload["centrality"])

          assert len(rows) == 5, f"expected 5 centrality cases, got {len(rows)}"
          report = {
              "schema_version": "agnxiv.centrality-real-v1/1",
              "cases": len(rows),
              "recall_at_1": sum(row["recall_at_1"] for row in rows) / len(rows),
              "recall_at_3": sum(row["recall_at_3"] for row in rows) / len(rows),
              "recall_at_5": sum(row["recall_at_5"] for row in rows) / len(rows),
              "first_gold_ranks": {
                  row["case_id"]: row["first_gold_rank"] for row in rows
              },
              "evaluation_role": "development",
              "caveat": (
                  "Five manually anchored public real-paper cases are a development "
                  "diagnostic, not a held-out generalization estimate."
              ),
          }
          Path("/tmp/centrality-real-v1.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))

          assert report["recall_at_5"] >= 0.80
          assert report["recall_at_3"] >= 0.60
          assert report["recall_at_1"] >= 0.40
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: centrality-real-v1-report
          path: /tmp/centrality-real-v1.json
          retention-days: 90
          if-no-files-found: warn
