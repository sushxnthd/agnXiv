name: verify-request

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  execute:
    if: startsWith(github.event.issue.title, '[AgnXiv Verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted AgnXiv worker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact trusted worker runtime
        run: python -m pip install --disable-pip-version-check -c constraints-service.txt "pydantic==2.14.1" "pypdf==6.21.1"

      - name: Run GitHub verification request
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m agnxiv.github_issue \
            --event "$GITHUB_EVENT_PATH" \
            --output-dir /tmp/agnxiv-request

      - name: Upload immutable request result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnxiv-issue-${{ github.event.issue.number }}
          path: /tmp/agnxiv-request
          retention-days: 30
          if-no-files-found: error

  publish:
    if: always() && startsWith(github.event.issue.title, '[AgnXiv Verify]')
    needs: execute
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Download verification result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agnxiv-issue-${{ github.event.issue.number }}
          path: /tmp/agnxiv-request

      - name: Publish result to request issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/agnxiv-request/summary.md', 'utf8');
            const result = JSON.parse(
              fs.readFileSync('/tmp/agnxiv-request/result.json', 'utf8')
            );
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const productUrl = `https://sushxnthd.github.io/agnXiv/result.html?issue=${context.issue.number}`;
            const body = `${summary}\n[Open in AgnXiv](${productUrl}) · [View execution record](${runUrl})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            if (result.status !== 'needs_review') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
