name: hosted-verify

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Hosted AgnXiv job ID
        required: true
        type: string
      mode:
        description: auto_plan, auto_verify, or verify_spec
        required: true
        type: string
      repository:
        description: Public GitHub owner/repository
        required: true
        type: string
      repository_ref:
        description: Git ref to inspect
        required: true
        type: string
      arxiv_id:
        description: arXiv ID for auto-plan or auto-verify jobs
        required: false
        type: string
      spec_path:
        description: Manifest path for verify-spec jobs
        required: false
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted AgnXiv worker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact trusted worker runtime
        run: python -m pip install --disable-pip-version-check -c constraints-service.txt "pydantic==2.14.1" "pypdf==6.21.1"

      - name: Execute untrusted research analysis without service credentials
        env:
          JOB_MODE: ${{ inputs.mode }}
          RESEARCH_REPOSITORY: ${{ inputs.repository }}
          RESEARCH_REF: ${{ inputs.repository_ref }}
          ARXIV_ID: ${{ inputs.arxiv_id }}
          SPEC_PATH: ${{ inputs.spec_path }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m agnxiv.hosted_runner \
            --mode "$JOB_MODE" \
            --repository "$RESEARCH_REPOSITORY" \
            --repository-ref "$RESEARCH_REF" \
            --arxiv-id "$ARXIV_ID" \
            --spec-path "$SPEC_PATH" \
            --output /tmp/agnxiv-hosted-result.json

      - name: Upload isolated result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnxiv-result-${{ inputs.job_id }}
          path: /tmp/agnxiv-hosted-result.json
          retention-days: 1
          if-no-files-found: error

  callback:
    if: ${{ always() }}
    needs: execute
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout trusted callback client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download isolated result
        id: download-result
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agnxiv-result-${{ inputs.job_id }}
          path: /tmp/agnxiv-result

      - name: Synthesize terminal failure when worker produced no result
        if: ${{ steps.download-result.outcome != 'success' }}
        env:
          EXECUTE_RESULT: ${{ needs.execute.result }}
        run: |
          mkdir -p /tmp/agnxiv-result
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          outcome = os.environ.get("EXECUTE_RESULT", "unknown")
          payload = {
              "status": "failed",
              "result": None,
              "error": (
                  "trusted hosted worker did not produce a callback artifact; "
                  f"execute_job={outcome}"
              ),
          }
          Path("/tmp/agnxiv-result/agnxiv-hosted-result.json").write_text(
              json.dumps(payload, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Authenticate with GitHub OIDC and deliver result
        env:
          CALLBACK_BASE_URL: ${{ vars.AGNXIV_PRODUCTION_URL }}
          OIDC_AUDIENCE_BASE: ${{ vars.AGNXIV_OIDC_AUDIENCE_BASE }}
          JOB_ID: ${{ inputs.job_id }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          for name in ("CALLBACK_BASE_URL", "OIDC_AUDIENCE_BASE"):
              value = os.environ.get(name, "").rstrip("/")
              parsed = urlparse(value)
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username
                  or parsed.password
                  or parsed.query
                  or parsed.fragment
              ):
                  raise SystemExit(f"{name} must be a clean HTTPS origin")
          PY
          CALLBACK_URL="${CALLBACK_BASE_URL%/}/internal/jobs/$JOB_ID/complete"
          OIDC_AUDIENCE="${OIDC_AUDIENCE_BASE%/}/jobs/$JOB_ID"
          python -m agnxiv.hosted_callback \
            --result /tmp/agnxiv-result/agnxiv-hosted-result.json \
            --callback-url "$CALLBACK_URL" \
            --audience "$OIDC_AUDIENCE"
