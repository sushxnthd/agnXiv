name: CLI real-paper acceptance

on:
  push:
    paths:
      - "src/**"
      - "tests/test_cli_external.py"
      - ".github/workflows/cli-real-paper-acceptance.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/**"
      - "tests/test_cli_external.py"
      - ".github/workflows/cli-real-paper-acceptance.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-external-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[pdf]"

      - name: Confirm local release prerequisites
        run: agnxiv doctor

      - name: Run the public CLI on one pinned external paper and repository
        run: |
          agnxiv verify-external \
            --repository synthiumjp/metacognitive-monitoring-battery \
            --repository-ref 2f83d0fa506e7af2b72ca191b65ce42e07c9e185 \
            --arxiv-id 2604.15702v2 \
            --expected-manuscript-sha256 f60c57f5c39453638b82b8eb1317db6b9e92d440ddf4b06eaab0a6f3a08605a7 \
            --output /tmp/agnxiv-real-paper-audit.json

      - name: Require measured evidence and conservative final abstention
        run: |
          python - <<'PY'
          import json
          with open("/tmp/agnxiv-real-paper-audit.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["schema"] == "agnxiv.external-run/1"
          assert payload["status"] == "needs_review"
          assert payload["error"] is None
          assert payload["readiness"]["ready"] is True
          result = payload["result"]
          assert result["kind"] == "verification"
          bundle = result["bundle"]
          assert bundle["record"]["verdict"] == "UNABLE_TO_VERIFY"
          assert bundle["provisional_verdict"] == "CONTRADICTED"
          assert bundle["record"]["expected"] == 0.51
          assert bundle["record"]["observed_mean"] == 0.504
          assert bundle["execution"]["returncode"] == 0
          assert bundle["observation_method"] == "explicit_regex"
          assert bundle["provenance"]["git"]["commit"] == "2f83d0fa506e7af2b72ca191b65ce42e07c9e185"
          print("PASS: public CLI completed a pinned external workflow and safely abstained.")
          PY

      - name: Preserve exported audit record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnxiv-cli-real-paper-audit
          path: /tmp/agnxiv-real-paper-audit.json
          retention-days: 30
          if-no-files-found: error
