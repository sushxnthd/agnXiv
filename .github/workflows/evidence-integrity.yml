name: evidence-integrity

on:
  push:
    paths:
      - "src/agnxiv/registry.py"
      - "src/agnxiv/pipeline.py"
      - "src/agnxiv/statement.py"
      - "src/agnxiv/service/app.py"
      - "src/agnxiv/service/db.py"
      - "migrations/**"
      - "tests/test_registry.py"
      - "tests/test_evidence_archive.py"
      - "tests/test_statement.py"
      - ".github/workflows/evidence-integrity.yml"
  pull_request:
    paths:
      - "src/agnxiv/registry.py"
      - "src/agnxiv/pipeline.py"
      - "src/agnxiv/statement.py"
      - "src/agnxiv/service/app.py"
      - "src/agnxiv/service/db.py"
      - "migrations/**"
      - "tests/test_registry.py"
      - "tests/test_evidence_archive.py"
      - "tests/test_statement.py"
      - ".github/workflows/evidence-integrity.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: |
          pytest             tests/test_registry.py             tests/test_evidence_archive.py             tests/test_statement.py             tests/test_service_hardening.py

  live-registry-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Resolve official Crossref and DataCite example records
        run: |
          python - <<'PY'
          from agnxiv.registry import resolve_crossref_doi, resolve_datacite_doi

          crossref = resolve_crossref_doi("10.1128/mbio.01735-25")
          assert crossref.registry == "crossref"
          assert crossref.doi == "10.1128/mbio.01735-25"
          assert len(crossref.registry_record_sha256) == 64

          datacite = resolve_datacite_doi("10.14454/qdd3-ps68")
          assert datacite.registry == "datacite"
          assert datacite.doi == "10.14454/qdd3-ps68"
          assert len(datacite.registry_record_sha256) == 64
          PY
