name: v0.2.0 release candidate

on:
  push:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "CHANGELOG.md"
      - "docs/CLI_EXTERNAL_VERIFICATION_RELEASE_GATE.md"
      - "docs/RELEASE_CANDIDATE_0_2_0.md"
      - "tests/test_release_candidate.py"
      - ".github/workflows/release-candidate.yml"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "CHANGELOG.md"
      - "docs/CLI_EXTERNAL_VERIFICATION_RELEASE_GATE.md"
      - "docs/RELEASE_CANDIDATE_0_2_0.md"
      - "tests/test_release_candidate.py"
      - ".github/workflows/release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-clean-install-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build wheel and source archive
        run: |
          python -m pip install "build==1.3.0"
          python -m build --sdist --wheel
          test -f dist/agnxiv-0.2.0-py3-none-any.whl
          test -f dist/agnxiv-0.2.0.tar.gz

      - name: Install only the candidate wheel in a clean environment
        run: |
          python -m venv /tmp/agnxiv-release-venv
          /tmp/agnxiv-release-venv/bin/python -m pip install             "dist/agnxiv-0.2.0-py3-none-any.whl[pdf]"
          /tmp/agnxiv-release-venv/bin/python -m pip check
          /tmp/agnxiv-release-venv/bin/python - <<'PY'
          from importlib.metadata import version
          assert version("agnxiv") == "0.2.0"
          PY
          /tmp/agnxiv-release-venv/bin/agnxiv --help
          /tmp/agnxiv-release-venv/bin/agnxiv doctor

      - name: Complete the pinned external paper workflow from the wheel
        run: |
          /tmp/agnxiv-release-venv/bin/agnxiv verify-external             --repository synthiumjp/metacognitive-monitoring-battery             --repository-ref 2f83d0fa506e7af2b72ca191b65ce42e07c9e185             --arxiv-id 2604.15702v2             --expected-manuscript-sha256 f60c57f5c39453638b82b8eb1317db6b9e92d440ddf4b06eaab0a6f3a08605a7             --output /tmp/agnxiv-v0.2.0-external-audit.json

      - name: Require measured evidence and conservative abstention
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/agnxiv-v0.2.0-external-audit.json").read_text(encoding="utf-8")
          )
          assert payload["schema"] == "agnxiv.external-run/1"
          assert payload["status"] == "needs_review"
          assert payload["error"] is None
          assert payload["readiness"]["ready"] is True
          bundle = payload["result"]["bundle"]
          assert bundle["record"]["verdict"] == "UNABLE_TO_VERIFY"
          assert bundle["provisional_verdict"] == "CONTRADICTED"
          assert bundle["record"]["expected"] == 0.51
          assert bundle["record"]["observed_mean"] == 0.504
          assert bundle["execution"]["returncode"] == 0
          assert bundle["observation_method"] == "explicit_regex"
          assert bundle["provenance"]["git"]["commit"] == (
              "2f83d0fa506e7af2b72ca191b65ce42e07c9e185"
          )
          PY

      - name: Build commit-bound release manifest
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = [
              Path("dist/agnxiv-0.2.0-py3-none-any.whl"),
              Path("dist/agnxiv-0.2.0.tar.gz"),
              Path("/tmp/agnxiv-v0.2.0-external-audit.json"),
          ]
          manifest = {
              "schema": "agnxiv.release-candidate/1",
              "version": "0.2.0",
              "commit": os.environ["CANDIDATE_COMMIT"],
              "published_release": False,
              "artifacts": [
                  {
                      "name": path.name,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in files
              ],
              "acceptance": {
                  "clean_wheel_install": True,
                  "dependency_check": True,
                  "doctor_ready": True,
                  "pinned_external_workflow_completed": True,
                  "final_verdict": "UNABLE_TO_VERIFY",
                  "false_pass": False,
              },
          }
          Path("/tmp/agnxiv-v0.2.0-release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Preserve candidate distributions and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnxiv-v0.2.0-release-candidate
          path: |
            dist/agnxiv-0.2.0-py3-none-any.whl
            dist/agnxiv-0.2.0.tar.gz
            /tmp/agnxiv-v0.2.0-external-audit.json
            /tmp/agnxiv-v0.2.0-release-manifest.json
          retention-days: 90
          if-no-files-found: error
