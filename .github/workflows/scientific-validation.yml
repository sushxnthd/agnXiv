name: scientific-validation

on:
  push:
    paths:
      - "src/agnxiv/benchmark.py"
      - "src/agnxiv/claims.py"
      - "src/agnxiv/outputs.py"
      - "src/agnxiv/verify.py"
      - "src/agnxiv/validation.py"
      - "research/scripts/run_external_false_pass_validation.py"
      - "research/scripts/run_external_centrality_validation.py"
      - "research/scripts/run_external_centrality_position_validation.py"
      - "research/scripts/run_scitldr_centrality_validation.py"
      - "research/scripts/run_historical_environment_validation.py"
      - "research/benchmarks/centrality-dev-paper-clusters-v1.txt"
      - "src/agnxiv/auto.py"
      - "tests/test_validation.py"
      - ".github/workflows/scientific-validation.yml"
  pull_request:
    paths:
      - "src/agnxiv/benchmark.py"
      - "src/agnxiv/claims.py"
      - "src/agnxiv/outputs.py"
      - "src/agnxiv/verify.py"
      - "src/agnxiv/validation.py"
      - "research/scripts/run_external_false_pass_validation.py"
      - "research/scripts/run_external_centrality_validation.py"
      - "research/scripts/run_external_centrality_position_validation.py"
      - "research/scripts/run_scitldr_centrality_validation.py"
      - "research/scripts/run_historical_environment_validation.py"
      - "research/benchmarks/centrality-dev-paper-clusters-v1.txt"
      - "src/agnxiv/auto.py"
      - "tests/test_validation.py"
      - ".github/workflows/scientific-validation.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-false-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout AgnXiv
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned ReproRepo validation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: LithiumDA/ReproRepo
          ref: 470a4c69d9f11df15526464e0a5bb66d95a12f55
          path: external/reprorepo
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install verifier
        run: python -m pip install -e ".[dev]"

      - name: Test statistical gate implementation
        run: pytest tests/test_validation.py

      - name: Run externally seeded held-out false-pass validation
        run: |
          python research/scripts/run_external_false_pass_validation.py \
            --input external/reprorepo/paper_lists/neurips_main-2022.csv \
            --input external/reprorepo/paper_lists/neurips_db-2022.csv \
            --input external/reprorepo/paper_lists/neurips_main-2024.csv \
            --input external/reprorepo/paper_lists/neurips_db-2024.csv \
            --input external/reprorepo/paper_lists/iclr-2026.csv \
            --max-cases 320 \
            --minimum-independent 299 \
            --output /tmp/agnxiv-external-false-pass.json

      - name: Assert production false-pass threshold
        run: |
          python - <<'PY'
          import json

          with open(
              "/tmp/agnxiv-external-false-pass.json",
              encoding="utf-8",
          ) as handle:
              report = json.load(handle)

          gate = report["gate"]
          assert report["independent_paper_clusters"] >= 299
          assert report["false_passes"] == 0
          assert len(report["strata"]) >= 3
          assert len(report["families"]) >= 8
          assert gate["passed"] is True
          assert gate["zero_false_pass_upper_bound"] <= 0.01
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scientific-validation-external-false-pass
          path: /tmp/agnxiv-external-false-pass.json
          retention-days: 90
          if-no-files-found: warn


  scitldr-centrality-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout AgnXiv
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned SciTLDR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: allenai/scitldr
          ref: 5ccad9c00a60ad75c9e04abf7f27d0f53f983b20
          path: external/scitldr
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install verifier
        run: python -m pip install -e .

      - name: Run SciTLDR development centrality benchmark
        run: |
          python research/scripts/run_scitldr_centrality_validation.py \
            --input external/scitldr/SciTLDR-Data/SciTLDR-AIC/dev.jsonl \
            --role development \
            --minimum-cases 75 \
            --min-recall-at-1 0.60 \
            --min-recall-at-3 0.90 \
            --min-recall-at-5 0.95 \
            --output /tmp/agnxiv-scitldr-centrality-dev.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scientific-validation-scitldr-centrality-dev
          path: /tmp/agnxiv-scitldr-centrality-dev.json
          retention-days: 90
          if-no-files-found: warn


  scitldr-centrality-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout AgnXiv
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned SciTLDR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: allenai/scitldr
          ref: 5ccad9c00a60ad75c9e04abf7f27d0f53f983b20
          path: external/scitldr
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install verifier
        run: python -m pip install -e .

      - name: Run untouched SciTLDR test centrality gate
        run: |
          python research/scripts/run_scitldr_centrality_validation.py \
            --input external/scitldr/SciTLDR-Data/SciTLDR-AIC/test.jsonl \
            --role heldout \
            --minimum-cases 30 \
            --min-recall-at-1 0.60 \
            --min-recall-at-3 0.90 \
            --min-recall-at-5 0.95 \
            --output /tmp/agnxiv-scitldr-centrality-heldout.json

      - name: Assert held-out centrality threshold
        run: |
          python - <<'PY'
          import json
          with open("/tmp/agnxiv-scitldr-centrality-heldout.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["evaluation_role"] == "heldout_external_oracle"
          assert report["cases"] >= 30
          assert report["recall_at_1"] >= 0.60
          assert report["recall_at_3"] >= 0.90
          assert report["recall_at_5"] >= 0.95
          assert report["passed"] is True
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scientific-validation-scitldr-centrality-heldout
          path: /tmp/agnxiv-scitldr-centrality-heldout.json
          retention-days: 90
          if-no-files-found: warn

  historical-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout AgnXiv
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned SciCoQA validation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: UKPLab/scicoqa
          ref: 463162906459be508ed4a2294fcaede9fa072036
          path: external/scicoqa
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install verifier
        run: python -m pip install -e ".[dev,pdf]"

      - name: Pull approved archaeology runtimes
        run: |
          docker pull python:3.10-slim
          docker pull python:3.11-slim
          docker pull python:3.12-slim

      - name: Run pinned historical environment recovery gate
        run: |
          python research/scripts/run_historical_environment_validation.py \
            --input external/scicoqa/data/scicoqa-real-v1.1.jsonl \
            --input external/scicoqa/data/scicoqa-synthetic-v1.1.jsonl \
            --max-classification 30 \
            --max-builds 8 \
            --output /tmp/agnxiv-historical-environment.json

      - name: Assert environment recovery threshold
        run: |
          python - <<'PY'
          import json
          with open("/tmp/agnxiv-historical-environment.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["classification_cases"] >= 20
          assert report["classification_accuracy"] >= 0.95
          assert report["build_attempts"] >= 8
          assert report["build_success_rate"] >= 0.75
          assert report["passed"] is True
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scientific-validation-historical-environment
          path: /tmp/agnxiv-historical-environment.json
          retention-days: 90
          if-no-files-found: warn
