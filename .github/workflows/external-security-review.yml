name: external-security-review

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "Dockerfile.service"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "SECURITY.md"
      - "docs/SECURITY_REVIEW.md"
  pull_request:
    paths:
      - "src/**"
      - "Dockerfile.service"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "SECURITY.md"
      - "docs/SECURITY_REVIEW.md"
  schedule:
    - cron: "11 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: "/language:python"
