name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate frontend JavaScript
        run: |
          node --check site/app.js
          node --check site/verify.js
          node --check site/result.js
          node --check site/lookup.js
          node --check site/challenge.js

      - name: Validate HTML structure and local links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          site = Path("site")
          pages = sorted(site.glob("*.html"))
          assert pages, "no HTML pages found"

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.add(attrs["id"])
                  if tag in {"a", "script", "link"}:
                      target = attrs.get("href") or attrs.get("src")
                      if target:
                          self.links.append(target)

          parsed = {}
          for page in pages:
              parser = Parser()
              parser.feed(page.read_text(encoding="utf-8"))
              parsed[page.name] = parser

          for page, parser in parsed.items():
              for target in parser.links:
                  url = urlparse(target)
                  if url.scheme or target.startswith("#"):
                      continue
                  path = url.path
                  if not path or path == "./":
                      candidate = site / "index.html"
                  else:
                      candidate = (site / path).resolve()
                  assert candidate.exists(), f"{page}: missing local target {target}"
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
