name: mainline-policy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  verified-pr-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require verified commit associated with merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')"
          if [ "$verified" != "true" ]; then
            echo "::error::main commit is not cryptographically verified"
            exit 1
          fi
          count="$(gh api             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls"             --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
          if [ "$count" -lt 1 ]; then
            echo "::error::main commit is not associated with a merged pull request"
            exit 1
          fi
