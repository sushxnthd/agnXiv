name: deepwalk-auto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact trusted worker runtime
        run: python -m pip install --disable-pip-version-check -c constraints-service.txt "pydantic==2.14.1" "pypdf==6.21.1"

      - name: Run zero-manifest planning on DeepWalk
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m agnxiv.hosted_runner \
            --mode auto_plan \
            --repository phanein/deepwalk \
            --repository-ref 6e6dff245e4692e9bea47e9017c1034e51afbf29 \
            --arxiv-id 1403.6652 \
            --output /tmp/deepwalk-auto.json
          cat /tmp/deepwalk-auto.json

      - name: Assert useful automation without unsafe certification
        run: |
          python - <<'PY'
          import json

          with open("/tmp/deepwalk-auto.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          assert payload["status"] == "needs_review"
          assert (
              payload["result"]["repository_commit"]
              == "6e6dff245e4692e9bea47e9017c1034e51afbf29"
          )
          plan = payload["result"]["plan"]

          assert plan["safe_to_execute"] is False
          assert plan["automation_score"] >= 0.75
          assert 0 < len(plan["claims"]) <= 20
          assert len(plan["commands"]) == 2

          commands = [" ".join(item["command"]) for item in plan["commands"]]
          assert any(command.startswith("deepwalk ") for command in commands)
          assert any("example_graphs/scoring.py" in command for command in commands)
          assert not any(command.startswith("Evaluation ") for command in commands)
          assert not any(command.startswith("This ") for command in commands)

          blockers = " ".join(plan["blockers"]).lower()
          assert "historical dependency" in blockers
          assert "execution order could not be inferred" not in blockers

          warnings = " ".join(plan["warnings"]).lower()
          assert "2-stage research workflow" in warnings

          draft = plan["draft_spec"]
          assert draft is not None
          assert len(draft["runtime"]["commands"]) == 2
          assert draft["runtime"]["commands"][0][0] == "deepwalk"
          assert "example_graphs/scoring.py" in draft["runtime"]["commands"][1]

          stages = {item["name"]: item for item in plan["stages"]}
          assert stages["paper_ingest"]["complete"] is True
          assert stages["claim_compilation"]["complete"] is True
          assert stages["environment_inference"]["complete"] is True
          assert stages["command_discovery"]["complete"] is True
          assert stages["workflow_ordering"]["complete"] is True
          assert stages["artifact_resolution"]["complete"] is True
          assert stages["verification_spec"]["complete"] is True
          assert stages["observation_locator"]["complete"] is False
          PY
